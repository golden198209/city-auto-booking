<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Auto - Zero Commission Booking</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --dark: #1f2937;
            --light: #f3f4f6;
            --success: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            margin-bottom: 15px;
            color: var(--dark);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
        }
        .section {
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-dark);
        }
        .card {
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            background: var(--success);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .ride-request {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .btn-accept {
            background-color: var(--success);
            margin-top: 10px;
        }
        .btn-accept:hover {
            background-color: #059669;
        }
        .switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .switcher button {
            background: #e5e7eb;
            color: var(--dark);
        }
        .switcher button.active {
            background: var(--dark);
            color: white;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛺 City Auto (Zero Commission)</h1>
        <p style="color: #6b7280; margin-bottom: 20px;">Local Auto Booking System Prototype</p>

        <!-- Role Switcher -->
        <div class="switcher">
            <button id="btnCustomerTab" class="active" onclick="switchTab('customer')">Customer View</button>
            <button id="btnDriverTab" onclick="switchTab('driver')">Driver View</button>
        </div>

        <!-- CUSTOMER SECTION -->
        <div id="customerSection" class="section">
            <h2>Book an Auto</h2>
            <div class="form-group">
                <label>Pickup Location</label>
                <input type="text" id="pickup" placeholder="e.g., Railway Station" value="Main Bus Stand">
            </div>
            <div class="form-group">
                <label>Drop Location</label>
                <input type="text" id="drop" placeholder="e.g., Civil Lines" value="City Market">
            </div>
            <button onclick="bookAuto()">Find Nearest Auto</button>

            <div id="customerStatus" class="card hidden" style="margin-top: 20px;">
                <h3>Status: <span id="rideState" style="color: var(--primary-dark);">Searching...</span></h3>
                <p id="assignedDriverInfo" style="margin-top: 5px;"></p>
            </div>
        </div>

        <!-- DRIVER SECTION -->
        <div id="driverSection" class="section hidden">
            <h2>Driver Dashboard</h2>
            <div class="status-badge">₹30 Daily Pass: ACTIVE ✅</div>
            
            <h3>Live Requests from City</h3>
            <div id="driverRequestsContainer">
                <p style="color: #6b7280; margin-top: 10px;">No new requests right now. Book an auto from the Customer view to test!</p>
            </div>
        </div>
    </div>

    <script>
        // Simple state management using browser memory
        function switchTab(role) {
            const customerSec = document.getElementById('customerSection');
            const driverSec = document.getElementById('driverSection');
            const btnCust = document.getElementById('btnCustomerTab');
            const btnDrive = document.getElementById('btnDriverTab');

            if(role === 'customer') {
                customerSec.classList.remove('hidden');
                driverSec.classList.add('hidden');
                btnCust.classList.add('active');
                btnDrive.classList.remove('active');
            } else {
                customerSec.classList.add('hidden');
                driverSec.classList.remove('hidden');
                btnDrive.classList.add('active');
                btnCust.classList.remove('active');
                loadRequests();
            }
        }

        function bookAuto() {
            const pickup = document.getElementById('pickup').value;
            const drop = document.getElementById('drop').value;

            if(!pickup || !drop) {
                alert("Please enter pickup and drop locations");
                return;
            }

            // Save request to localStorage so driver view can see it
            const rideData = {
                id: Date.now(),
                pickup: pickup,
                drop: drop,
                status: 'Searching'
            };
            localStorage.setItem('currentRide', JSON.stringify(rideData));

            // Show status
            const statusBox = document.getElementById('customerStatus');
            statusBox.classList.remove('hidden');
            document.getElementById('rideState').innerText = "Searching for nearby autos...";
            document.getElementById('assignedDriverInfo').innerText = "Broadcasting to local drivers...";

            // Switch to driver tab automatically for easy testing
            setTimeout(() => {
                alert("Ride request broadcasted! Check Driver View.");
            }, 500);
        }

        function loadRequests() {
            const container = document.getElementById('driverRequestsContainer');
            const rideJson = localStorage.getItem('currentRide');

            if(!rideJson) {
                container.innerHTML = '<p style="color: #6b7280; margin-top: 10px;">No new requests right now.</p>';
                return;
            }

            const ride = JSON.parse(rideJson);
            if(ride.status === 'Accepted') {
                container.innerHTML = `<div class="card"><h3>Ride Accepted!</h3><p>From: ${ride.pickup} ➔ To: ${ride.drop}</p></div>`;
                return;
            }

            container.innerHTML = `
                <div class="ride-request">
                    <p><strong>Pickup:</strong> ${ride.pickup}</p>
                    <p><strong>Drop:</strong> ${ride.drop}</p>
                    <p><strong>Estimated Fare:</strong> ₹80 (0% Commission)</p>
                    <button class="btn-accept" onclick="acceptRide()">Accept Ride</button>
                </div>
            `;
        }

        function acceptRide() {
            let ride = JSON.parse(localStorage.getItem('currentRide'));
            ride.status = 'Accepted';
            localStorage.setItem('currentRide', JSON.stringify(ride));

            alert("You accepted the ride! Proceeding to pickup location.");
            loadRequests();
        }
    </script>
</body>
</html>
