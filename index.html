<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatri Auto - GPS Navigation</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --dark: #111827;
            --light: #f9fafb;
            --card-bg: #ffffff;
            --success: #10b981;
            --gray: #6b7280;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e5e7eb;
        }
        .app-header {
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .app-header h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .app-header p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }
        .nav-tabs {
            display: flex;
            background: #e5e7eb;
            padding: 4px;
        }
        .nav-tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 18px;
            transition: all 0.2s ease;
            color: var(--gray);
        }
        .nav-tabs button.active {
            background: white;
            color: var(--dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .app-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .hidden {
            display: none !important;
        }
        .card {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        .btn-gps {
            background: #e5e7eb;
            border: none;
            padding: 0 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-gps:hover {
            background: #d1d5db;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ecfdf5;
            color: var(--success);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
            border: 1px solid #a7f3d0;
        }
        .ride-card {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }
        .fare-tag {
            font-size: 18px;
            font-weight: bold;
            color: #047857;
            margin: 8px 0;
        }
        .info-text {
            font-size: 13px;
            color: var(--gray);
            line-height: 1.4;
        }
        .btn-action {
            display: block;
            text-align: center;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-maps {
            background-color: #ea580c;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h1>🛺 Yatri Auto</h1>
            <p>Zero Commission • GPS Live Navigation</p>
        </div>

        <div class="nav-tabs">
            <button id="tabCust" class="active" onclick="switchView('customer')">Passenger</button>
            <button id="tabDriver" onclick="switchView('driver')">Driver Partner</button>
        </div>

        <div class="app-body">
            <!-- CUSTOMER VIEW -->
            <div id="customerView">
                <div class="form-group">
                    <label>Pickup Point</label>
                    <div class="input-row">
                        <input type="text" id="pickupLoc" placeholder="Type landmark or use GPS">
                        <button class="btn-gps" onclick="getGPSLocation()" title="Detect Current GPS Location">📍</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Destination Drop</label>
                    <input type="text" id="dropLoc" placeholder="Where to go?">
                </div>
                <div class="form-group">
                    <label>Your Phone Number</label>
                    <input type="text" id="custPhone" placeholder="10-digit mobile number">
                </div>
                <button class="btn-primary" onclick="requestRide()">Find Auto (0% Commission)</button>

                <div id="customerStatusCard" class="card hidden" style="margin-top: 20px;">
                    <h3 id="statusTitle" style="color: #b45309; font-size: 16px; margin-bottom: 6px;">Searching Auto...</h3>
                    <p id="statusDesc" class="info-text">Broadcasting your request to nearby drivers.</p>
                    <div id="customerDriverContact" class="hidden" style="margin-top: 10px;"></div>
                </div>
            </div>

            <!-- DRIVER VIEW -->
            <div id="driverView" class="hidden">
                <div class="badge">
                    <span>🟢 ₹30 Daily Pass Active</span>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>Driver Phone Number</label>
                    <input type="text" id="driverPhone" value="9123456789">
                </div>

                <h3 style="font-size: 15px; margin-bottom: 10px; color: var(--dark);">Live Radar Requests</h3>
                <div id="driverFeed">
                    <div class="card" style="background: #f9fafb; border-color: #e5e7eb;">
                        <p class="info-text" style="text-align: center; color: var(--gray);">No ride requests in your area right now.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLat = null;
        let currentLon = null;

        function switchView(role) {
            const custView = document.getElementById('customerView');
            const drivView = document.getElementById('driverView');
            const tabC = document.getElementById('tabCust');
            const tabD = document.getElementById('tabDriver');

            if(role === 'customer') {
                custView.classList.remove('hidden');
                drivView.classList.add('hidden');
                tabC.classList.add('active');
                tabD.classList.remove('active');
                checkCustomerStatus();
            } else {
                custView.classList.add('hidden');
                drivView.classList.remove('hidden');
                tabD.classList.add('active');
                tabC.classList.remove('active');
                renderDriverFeed();
            }
        }

        // GPS Live Location Fetcher
        function getGPSLocation() {
            if (navigator.geolocation) {
                document.getElementById('pickupLoc').value = "Acquiring GPS location...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        document.getElementById('pickupLoc').value = `GPS Pin (${currentLat.toFixed(4)}, ${currentLon.toFixed(4)})`;
                    },
                    (error) => {
                        alert("GPS permission denied or unavailable. Please type location manually.");
                        document.getElementById('pickupLoc').value = "";
                        currentLat = null;
                        currentLon = null;
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        function requestRide() {
            const pickup = document.getElementById('pickupLoc').value;
            const drop = document.getElementById('dropLoc').value;
            const phone = document.getElementById('custPhone').value;

            if(!pickup || !drop || !phone) {
                alert("Please fill all required details");
                return;
            }

            const estimatedKm = (Math.random() * 4 + 2).toFixed(1);
            const calculatedFare = Math.round(30 + (estimatedKm * 12));

            const rideInfo = {
                id: Date.now(),
                pickup: pickup,
                drop: drop,
                phone: phone,
                lat: currentLat,
                lon: currentLon,
                distance: estimatedKm,
                fare: calculatedFare,
                status: 'Searching',
                acceptedBy: null
            };

            localStorage.setItem('active_ride', JSON.stringify(rideInfo));

            const statusCard = document.getElementById('customerStatusCard');
            statusCard.classList.remove('hidden');
            document.getElementById('statusTitle').innerText = "Finding Nearby Auto...";
            document.getElementById('statusDesc').innerText = `Distance: ~${estimatedKm} km | Fare: ₹${calculatedFare} (0% Commission).`;
            document.getElementById('customerDriverContact').classList.add('hidden');

            alert("Ride request broadcasted successfully!");
        }

        function renderDriverFeed() {
            const feed = document.getElementById('driverFeed');
            const rideData = localStorage.getItem('active_ride');

            if(!rideData) {
                feed.innerHTML = `<div class="card" style="background: #f9fafb; border-color: #e5e7eb;"><p class="info-text" style="text-align: center; color: var(--gray);">No ride requests right now.</p></div>`;
                return;
            }

            const ride = JSON.parse(rideData);

            if(ride.status === 'Accepted') {
                feed.innerHTML = `
                    <div class="ride-card">
                        <h3 style="color: #065f46; font-size: 16px;">Ride Locked</h3>
                        <p class="info-text" style="margin-top: 6px;">This ride has already been accepted.</p>
                    </div>
                `;
                return;
            }

            // Google Maps link generation if coordinates exist
            let mapsButtonHtml = '';
            if (ride.lat && ride.lon) {
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${ride.lat},${ride.lon}`;
                mapsButtonHtml = `<a href="${mapsUrl}" target="_blank" class="btn-action btn-maps">📍 Open GPS in Google Maps</a>`;
            }

            feed.innerHTML = `
                <div class="ride-card">
                    <span style="font-size: 11px; font-weight: bold; background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 4px;">LIVE REQUEST</span>
                    <p class="info-text" style="margin-top: 8px;"><strong>Pickup:</strong> ${ride.pickup}</p>
                    <p class="info-text"><strong>Drop:</strong> ${ride.drop}</p>
                    <p class="info-text"><strong>Est. Distance:</strong> ~${ride.distance} km</p>
                    <div class="fare-tag">Earnings: ₹${ride.fare}</div>
                    ${mapsButtonHtml}
                    <button class="btn-primary" style="background-color: #059669; margin-top: 8px; padding: 12px;" onclick="acceptRide()">Accept Ride Instantly</button>
                </div>
            `;
        }

        function acceptRide() {
            let ride = JSON.parse(localStorage.getItem('active_ride'));
            const driverPhone = document.getElementById('driverPhone').value;

            if(ride.status === 'Accepted') {
                alert("Oops! Yeh ride pehle hi koi aur accept kar chuka hai.");
                renderDriverFeed();
                return;
            }

            ride.status = 'Accepted';
            ride.acceptedBy = driverPhone;
            localStorage.setItem('active_ride', JSON.stringify(ride));

            alert("Ride successfully locked!");
            renderDriverFeed();
        }

        function checkCustomerStatus() {
            const rideData = localStorage.getItem('active_ride');
            if(!rideData) return;

            const ride = JSON.parse(rideData);
            const statusCard = document.getElementById('customerStatusCard');
            const contactDiv = document.getElementById('customerDriverContact');

            if(ride.status === 'Accepted') {
                statusCard.classList.remove('hidden');
                document.getElementById('statusTitle').innerText = "Auto Confirmed! 🛺";
                document.getElementById('statusDesc').innerText = `Your driver is on the way. Fare: ₹${ride.fare}`;
                
                contactDiv.classList.remove('hidden');
                contactDiv.innerHTML = `
                    <p class="info-text" style="margin-top: 6px;"><strong>Driver Phone:</strong> ${ride.acceptedBy}</p>
                    <a href="tel:${ride.acceptedBy}" class="btn-action">📞 Call Driver Now</a>
                `;
            }
        }
    </script>
</body>
</html>
